# Local Postgres for running the database tests on your own machine:
#   docker compose up -d db
#   export DATABASE_URL=postgres://postgres:postgres@localhost:5432/appdb
#   npm run test:local
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10
