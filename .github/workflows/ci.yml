name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
      - cache

env:
  APP_NAME: solar-system
  API_KEY: ${{ secrets.API_KEY }}   
  POSTGRES_USER: ${{ vars.POSTGRES_USER}}
  POSTGRES_PASSWORD:    ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  unit-testing:
    name: unit testing
    strategy:
      matrix:
        nodejs_version: [18,19,20]
        operating_system: [ubuntu-latest,macos-latest]
        exclude:
           - nodejs_version: 19
             operating_system: macos-latest
           - nodejs_version: 20
             operating_system: macos-latest

    runs-on: ${{ matrix.operating_system }}        
 
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodejs_version}}

      - name: caching the dependency
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.nodejs_version }}-modules-${{ hashFiles('package-lock.json') }}

      - name: printing env variables
        run: |
          echo " APP_NAME: ${{ env.APP_NAME }}"
          echo " API_KEY: ${{ secrets.API_KEY }} "   

     
      - name: install dependencies

        run: npm install

      - name: Printing env variable
        run: |
          echo ${{ env.APP_NAME }}
          echo ${{ secrets.API_KEY}}  

      - name: run unit test
        run: npm test

      - name: upload test results
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-test-Result-${{ matrix.nodejs_version }}-${{ matrix.operating_system }}
          path: test-results.xml          
  
  integration-testing:
    name: integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: appdb
        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10  

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup nodejs
        uses: actions/setup-node@v4          
        with:
          node-version: 20

      - name: install dependencies
        run: npm install

      - name: run test against postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb
        run: npm run test:local      

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup node 
        uses: actions/setup-node@v4
        with:
          node-version: 20        

      - name: install dependencies
        run: npm install

      - name: run eslit
        run: npm run lint

  coverage:
    name: coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10 

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install dependencies
        run: npm install

      - name: run coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb
        run: npm run coverage

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report 
          path: coverage/   

  docker:
    name: docker
    runs-on: ubuntu-latest     
    needs: [unit-testing,integration-testing,lint,coverage]

    steps:
      - name: checkout report
        uses: actions/checkout@v4

      - name: docker hub login
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD}}      

      - name: Build Docker Image for Testing
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/practice:${{ github.sha }}   

      - name: smoke test the container
        run: |
          docker run -d --name app -p 3000:3000 ${{ vars.DOCKERHUB_USERNAME }}/practice:${{ github.sha }} 
          sleep 3
          curl --fail http://localhost:3000/health 

      - name: docker push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ vars.name }}/practice:${{ github.sha }}      



