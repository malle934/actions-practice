name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
      - cache

env:
  APP_NAME: solar-system
  API_KEY: ${{ secrets.API_KEY }}   
  POSTGRES_USER: ${{ vars.POSTGRES_USER}}
  POSTGRES_PASSWORD:    ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  unit-testing:
    name: unit testing
    strategy:
      matrix:
        nodejs_version: [18,19,20]
        operating_system: [ubuntu-latest,macos-latest]
        exclude:
           - nodejs_version: 19
             operating_system: macos-latest
           - nodejs_version: 20
             operating_system: macos-latest

    runs-on: ${{ matrix.operating_system }}        
 
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodejs_version}}

      - name: caching the dependency
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.nodejs_version }}-modules-${{ hashFiles('package-lock.json') }}

      - name: printing env variables
        run: |
          echo " APP_NAME: ${{ env.APP_NAME }}"
          echo " API_KEY: ${{ secrets.API_KEY }} "   

     
      - name: install dependencies

        run: npm install

      - name: Printing env variable
        run: |
          echo ${{ env.APP_NAME }}
          echo ${{ secrets.API_KEY}}  

      - name: run unit test
        run: npm test

      - name: upload test results
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-test-Result-${{ matrix.nodejs_version }}-${{ matrix.operating_system }}
          path: test-results.xml          
  
  integration-testing:
    name: integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: appdb
        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10  

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup nodejs
        uses: actions/setup-node@v4          
        with:
          node-version:20

      - name: install dependencies
        run: npm install

      - name: run test against postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb
        run: npm run test:local      