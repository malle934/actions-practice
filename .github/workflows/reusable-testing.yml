name: reusable-testing

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string


jobs:
  testing:
    name: testing
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setupnode
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: install dependencies
        run: npm install

      - name: testing node app
        run: npm test      
